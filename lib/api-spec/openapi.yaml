openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Buffet Orders API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: orders
    description: Order operations
  - name: stats
    description: Statistics operations
  - name: menu
    description: Menu operations
  - name: projects
    description: Project selection
  - name: admin
    description: Administrator operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: Get projects available for login and registration
      responses:
        "200":
          description: Available projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /admin/projects:
    post:
      operationId: createProject
      tags: [admin]
      summary: Add a project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List users without passwords (admin only)
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Change a user's role (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          description: User role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid role change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/workers:
    post:
      operationId: createWorker
      tags: [admin]
      summary: Create a buffet worker for one project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerRequest"
      responses:
        "201":
          description: Worker created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid worker data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/workers/{id}:
    patch:
      operationId: updateWorker
      tags: [admin]
      summary: Change a worker project, password, name, or active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkerRequest"
      responses:
        "200":
          description: Worker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid worker data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Get all orders (worker) or my orders (customer)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, completed, all]
        - name: mine
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/deliver:
    patch:
      operationId: deliverOrder
      tags: [orders]
      summary: Mark order as delivered (worker only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order marked as delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/reject:
    patch:
      operationId: rejectOrder
      tags: [orders]
      summary: Customer rejects a delivered order (returns to pending)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order returned to pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/confirm:
    patch:
      operationId: confirmOrder
      tags: [orders]
      summary: Confirm order received (customer only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order confirmed as received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/daily:
    get:
      operationId: getDailyStats
      tags: [stats]
      summary: Get daily statistics for all users
      responses:
        "200":
          description: Daily statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyStats"

  /menu:
    get:
      operationId: getMenuItems
      tags: [menu]
      summary: Get all menu items
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        projectId:
          type: string
      required:
        - username
        - password
        - projectId

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [customer]
        projectId:
          type: string
      required:
        - username
        - password
        - displayName
        - role
        - projectId

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [customer, worker, admin]
        projectId:
          type: string
        projectName:
          type: string
      required:
        - id
        - username
        - displayName
        - role
        - projectId
        - projectName

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - createdAt

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    AdminUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [customer, worker, admin]
        projectId:
          type: [string, "null"]
        projectName:
          type: [string, "null"]
        isActive:
          type: boolean
      required:
        - id
        - username
        - displayName
        - role
        - projectId
        - projectName
        - isActive

    UpdateUserRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum: [customer, admin]
      required:
        - role

    CreateWorkerRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        projectId:
          type: string
      required:
        - username
        - password
        - displayName
        - projectId

    UpdateWorkerRequest:
      type: object
      properties:
        displayName:
          type: string
        password:
          type: string
          minLength: 8
        projectId:
          type: string
        isActive:
          type: boolean

    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userDisplayName:
          type: string
        projectId:
          type: string
        menuItemId:
          type: string
        menuItemName:
          type: string
        menuItemNameAr:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [pending, delivered, completed]
        createdAt:
          type: string
        completedAt:
          type: string
      required:
        - id
        - userId
        - userDisplayName
        - projectId
        - menuItemId
        - menuItemName
        - menuItemNameAr
        - status
        - createdAt

    CreateOrderRequest:
      type: object
      properties:
        menuItemId:
          type: string
        notes:
          type: string
      required:
        - menuItemId

    MenuItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameAr:
          type: string
        category:
          type: string
          enum: [hot, cold, juice, other]
        icon:
          type: string
      required:
        - id
        - name
        - nameAr
        - category
        - icon

    DailyStats:
      type: object
      properties:
        date:
          type: string
        totalOrders:
          type: number
        completedOrders:
          type: number
        pendingOrders:
          type: number
        byUser:
          type: array
          items:
            $ref: "#/components/schemas/UserStat"
        byItem:
          type: array
          items:
            $ref: "#/components/schemas/ItemStat"
      required:
        - date
        - totalOrders
        - completedOrders
        - pendingOrders
        - byUser
        - byItem

    UserStat:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        totalOrders:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserItemStat"
      required:
        - userId
        - displayName
        - totalOrders
        - items

    UserItemStat:
      type: object
      properties:
        menuItemId:
          type: string
        menuItemName:
          type: string
        menuItemNameAr:
          type: string
        count:
          type: number
      required:
        - menuItemId
        - menuItemName
        - menuItemNameAr
        - count

    ItemStat:
      type: object
      properties:
        menuItemId:
          type: string
        menuItemName:
          type: string
        menuItemNameAr:
          type: string
        count:
          type: number
      required:
        - menuItemId
        - menuItemName
        - menuItemNameAr
        - count

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
