# Render Blueprint Configuration (render.yaml)
# ضع هذا الملف في المجلد الرئيسي (Root) لمستودع GitHub على الفرع buffet لنشر المشروع بالكامل (قاعدة البيانات + السيرفر + الواجهة) بضغطة واحدة مجاناً.

databases:
  - name: buffet-db
    databaseName: buffet
    user: buffet_user
    plan: free

services:
  # 1. خادم الـ API الخلفي (Backend Express + Drizzle)
  - type: web
    name: buffet-api-server
    runtime: node
    plan: free
    repo: https://github.com/ahmednga70-a11y/Buffet-Order-System
    branch: buffet
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/db run push-force && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: buffet-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        value: "BuffetAdmin2026!"

  # 2. تطبيق الويب (Expo Web Frontend SPA)
  - type: web
    name: buffet-web-app
    runtime: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/mobile exec expo export --platform web
    staticPublishPath: artifacts/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: EXPO_PUBLIC_API_URL
        value: "https://buffet-api-server.onrender.com"
